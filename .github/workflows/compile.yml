name: Build & Release

on: [push,workflow_dispatch]

jobs:
  build-release:
    uses: RaphaelIT7/gmod-common-module-base/.github/workflows/compile-release.yml@workflow
    permissions:
      contents: write
    with:
      PROJECT_NAME: "icvar"
      BUILD_64x: "true"
      REALM: "cl"
      ARTIFACT_EXPIRE: "30"
      RELEASE_DRAFT: false
      RELEASE_LATEST: true
      SOURCESDK_MINIMAL: "RaphaelIT7/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "patch-7"
      SOURCESDK_MINIMAL_64XBRANCH: "x86-64-patch-3"
      GARRYSMOD_COMMON: "RaphaelIT7/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "holylib"
