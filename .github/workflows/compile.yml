name: Build & Release

on: [push,workflow_dispatch]

jobs:
  build-release:
    uses: RaphaelIT7/gmod-common-module-base/.github/workflows/compile-release.yml@workflow
    permissions:
      contents: write
    with:
      PROJECT_NAME: "icvar"
      BUILD_64x: "true"
      REALM: "cl"
      ARTIFACT_EXPIRE: "30"
      RELEASE_DRAFT: false
      RELEASE_LATEST: true
      BUILD_32x: "false"
      BUILD_LINUX: "false"
      SOURCESDK_MINIMAL: "danielga/sourcesdk-minimal"
      SOURCESDK_MINIMAL_BRANCH: "master"
      GARRYSMOD_COMMON: "danielga/garrysmod_common"
      GARRYSMOD_COMMON_BRANCH: "master"